name: Release Checks

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - codex/**

concurrency:
  group: release-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.x'
  NEXT_TELEMETRY_DISABLED: '1'
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fleetflow_test
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/fleetflow_test
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_dummy
  CLERK_SECRET_KEY: sk_test_dummy
  NEXT_PUBLIC_CLERK_SIGN_IN_URL: /login
  NEXT_PUBLIC_CLERK_SIGN_UP_URL: /signup
  NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: /dispatch
  STRIPE_SECRET_KEY: sk_test_dummy
  STRIPE_WEBHOOK_SECRET: whsec_dummy

jobs:
  release-check:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fleetflow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Guard workflow commands
        run: npm run ci:workflow-guard
      - name: Release check
        run: npm run release:check
      - name: Upload build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: next-build-artifacts
          path: |
            .next
            npm-debug.log*
            pnpm-debug.log*
            yarn-error.log*

  summary:
    name: Release summary
    runs-on: ubuntu-latest
    needs: [release-check]
    if: always()
    steps:
      - name: Aggregate result
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "- release gate: ${{ needs.release-check.result }}" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ needs.release-check.result }}" != "success" ]]; then
            exit 1
          fi
